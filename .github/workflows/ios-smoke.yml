name: iOS smoke tests

on:
  schedule:
    - cron: '0 5,11,17 * * *'
  workflow_dispatch:
    inputs:
      evaka_ref:
        description: eVaka branch, tag or commit to test
        default: master
        required: false

concurrency:
  group: ios-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-smoke:
    runs-on: [self-hosted, macOS, ios-smoke]
    timeout-minutes: 90
    env:
      EVAKA_REF: ${{ inputs.evaka_ref || 'master' }}
    steps:
      - uses: actions/checkout@v7
      # Outside the workspace so that node_modules, the gradle caches and
      # .appium survive between runs
      - name: Set the eVaka directory
        run: echo "EVAKA_DIR=$HOME/evaka-ios-smoke/evaka" >> "$GITHUB_ENV"
      - name: Check out eVaka
        run: scripts/evaka-checkout.sh
      - name: Start eVaka
        run: scripts/stack-up.sh
      - name: Run the iOS smoke tests
        run: scripts/run-smoke.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-smoke-results
          path: results/
          if-no-files-found: ignore
      - name: Stop eVaka
        if: always()
        run: scripts/stack-down.sh
      # A Slack incoming webhook for #evaka-alerts-ios-smoke, stored as the
      # repository secret SLACK_WEBHOOK_URL
      - name: Alert Slack
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: >-
            :red_circle: iOS smoke tests ${{ job.status }} on eVaka `${{ env.EVAKA_REF }}`
            (${{ github.event_name }}, runner ${{ runner.name }}):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/slack-alert.sh
